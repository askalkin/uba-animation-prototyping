<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBA Splash Animation</title>
<style>
  :root {
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #121214;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    min-height: 100%;
    padding: 40px 16px;
  }

  .frame {
    position: relative;
    width: 390px;
    height: 844px;
    max-width: 100%;
    background: #D51709;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
  }

  /* ---------- brand lockup layout ----------
     Sizes and positions below come directly from the Figma file
     (node 273:3201): a 220×106.05 logo group, horizontally centered and
     pinned at top:326px in the 390×844 frame (326px, not vertical-center —
     Figma has it sitting ~43px above true center). Everything inside is
     positioned in that group's own coordinate space (0,0 = group's
     top-left) so the numbers below match the Figma inspector 1:1:
       UBA:      144×51,  left:-2  top:25
       icon:     64.36 wide (2px stroke), right-flush, top-flush
       subtitle: 206×15.8 (tight glyph height), left:0, bottom-flush
  */

  .brand {
    position: absolute;
    left: 50%;
    top: 326px;
    transform: translateX(-50%);
    width: 220px;
    height: 106.05px;
  }

  .top-mask {
    /* bottom edge is the fixed centerline (83.114px down) that .bottom-mask
       continues from — that edge must stay put. Top and right are padded
       5px beyond the group's own bounds purely so the icon's stroke-width
       overshoot (it sits flush against both those edges) has clearance
       instead of being clipped; nothing visible lives in that 5px. */
    position: absolute;
    left: 0;
    top: -5px;
    width: 225px;
    height: 88.114px;
    overflow: hidden;
  }

  .bottom-mask {
    position: absolute;
    left: 0;
    top: 83.114px;
    width: 220px;
    height: 22.936px;
    overflow: hidden;
  }

  .top-row {
    /* re-establishes the group's own (0,0) origin inside the padded
       .top-mask, so icon-slot/row1-wrap below can use the Figma numbers
       directly without re-deriving them against the padded box. */
    position: absolute;
    left: 0;
    top: 5px;
    width: 220px;
    height: 83.114px;
    will-change: transform;
  }

  /* ---------- graphic mark ---------- */
  /* Right-flush and top-flush against the group (Figma: right:0, top:0).
     The svg viewBox is padded 4 units beyond the path geometry's own
     bounding box so the 2pt stroke never brushes the edge of icon-slot's
     box (which would get clipped by .top-mask) — the padding is invisible,
     the glyph itself still lines up exactly with Figma's right/top edges. */

  .icon-slot {
    position: absolute;
    left: 151.394px;
    top: -4.246px;
    width: 72.852px;
    height: 84.147px;
  }

  .icon-svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .icon-stroke {
    fill: none;
    stroke: #ffffff;
    stroke-width: 2;
    stroke-linecap: round; /* the path is closed (M...Z) so the dash pattern's
      start/end meet at the exact corner we chose as the draw's starting
      point (bottom-left of the left shape, top-right of the right shape) —
      with `butt` that seam renders as a flat, blunt cut instead of the
      rounded join every other corner gets from stroke-linejoin:round; a
      round cap there blends into the same rounded look instead */
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    opacity: 0; /* a zero-length dash (dashoffset 1 == dasharray 1) still
      paints a visible dot at the path's start point because round linecap
      applies regardless of dash length — hide the stroke entirely until the
      draw phase actually begins so those two seam dots aren't visible during
      reveal/align */
  }

  .icon-fill {
    fill: #ffffff;
    stroke: none;
    opacity: 0;
  }

  /* ---------- wordmark ---------- */
  /* row1-wrap is a 206px-wide reference box (matching the subtitle's width)
     so row1-svg can be centered over it for the initial reveal, then slide
     to translateX(-2px) — Figma's exact final left offset — for "align". */

  .row1-wrap {
    position: absolute;
    left: 0;
    top: 25px;
    width: 206px;
    height: 51px;
    clip-path: inset(100% 0 0 0);
  }

  .row1-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 144px;
    height: 51px;
    display: block;
    transform: translateX(31px); /* centered over the 206px-wide row1-wrap:
                                     (206 - 144) / 2 */
    will-change: transform;
  }

  .row2-wrap {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 206px;
    height: 15.822px;
    clip-path: inset(0 0 100% 0);
    will-change: transform;
  }

  .row2-svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- transitions per element (durations live here; phases just set target values) ---------- */

  .row1-wrap {
    transition: clip-path 0.75s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .row2-wrap {
    transition:
      clip-path 0.75s cubic-bezier(0.16, 1, 0.3, 1),
      transform 0.62s cubic-bezier(0.7, 0, 0.84, 0);
  }

  .row1-svg {
    transition: transform 0.55s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .top-row {
    transition: transform 0.62s cubic-bezier(0.7, 0, 0.84, 0);
  }

  .icon-stroke {
    transition: stroke-dashoffset 0.95s cubic-bezier(0.45, 0, 0.15, 1);
  }

  .icon-fill {
    transition: opacity 0.38s ease;
  }

  /* kill all transitions while the frame is being reset between loops */
  .frame.resetting .row1-wrap,
  .frame.resetting .row2-wrap,
  .frame.resetting .row1-svg,
  .frame.resetting .top-row,
  .frame.resetting .icon-stroke,
  .frame.resetting .icon-fill {
    transition: none !important;
  }

  /* ---------- phase target states ---------- */

  .frame[data-phase="reveal"] .row1-wrap,
  .frame[data-phase="align"] .row1-wrap,
  .frame[data-phase="draw"] .row1-wrap,
  .frame[data-phase="fill"] .row1-wrap,
  .frame[data-phase="hold"] .row1-wrap,
  .frame[data-phase="exit"] .row1-wrap {
    clip-path: inset(0 0 0 0);
  }

  .frame[data-phase="reveal"] .row2-wrap,
  .frame[data-phase="align"] .row2-wrap,
  .frame[data-phase="draw"] .row2-wrap,
  .frame[data-phase="fill"] .row2-wrap,
  .frame[data-phase="hold"] .row2-wrap,
  .frame[data-phase="exit"] .row2-wrap {
    clip-path: inset(0 0 0 0);
  }

  .frame[data-phase="align"] .row1-svg,
  .frame[data-phase="draw"] .row1-svg,
  .frame[data-phase="fill"] .row1-svg,
  .frame[data-phase="hold"] .row1-svg,
  .frame[data-phase="exit"] .row1-svg {
    transform: translateX(-2px); /* Figma's exact final left offset for UBA */
  }

  .frame[data-phase="draw"] .icon-stroke,
  .frame[data-phase="fill"] .icon-stroke,
  .frame[data-phase="hold"] .icon-stroke,
  .frame[data-phase="exit"] .icon-stroke {
    stroke-dashoffset: 0;
    opacity: 1;
  }

  .frame[data-phase="fill"] .icon-fill,
  .frame[data-phase="hold"] .icon-fill,
  .frame[data-phase="exit"] .icon-fill {
    opacity: 1;
  }

  .frame[data-phase="exit"] .top-row {
    transform: translateY(89.114px); /* clears the 83.114px top-mask with margin to spare */
  }

  .frame[data-phase="exit"] .row2-wrap {
    transform: translateY(-28.936px); /* clears the 22.936px bottom-mask with margin to spare */
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .replay-btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.06);
    color: #f2f2f3;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
  }

  .replay-btn:hover {
    background: rgba(255, 255, 255, 0.12);
  }

  .dims {
    color: rgba(255, 255, 255, 0.4);
    font-size: 12px;
    letter-spacing: 0.02em;
  }
</style>
</head>

<script>
  const frame = document.getElementById('frame');
  const replayBtn = document.getElementById('replayBtn');
  let loopTimer = null;
  const timers = [];

  function clearLoop() {
    if (loopTimer) {
      clearTimeout(loopTimer);
      loopTimer = null;
    }
    timers.forEach(clearTimeout);
    timers.length = 0;
  }

  function after(ms, fn) {
    const id = setTimeout(fn, ms);
    timers.push(id);
    return id;
  }

  function resetToIdle() {
    frame.classList.add('resetting');
    frame.removeAttribute('data-phase');
    // force reflow so the reset is committed with transitions disabled
    void frame.offsetWidth;
    frame.classList.remove('resetting');
  }

  function playOnce(onDone) {
    resetToIdle();

    after(60, () => {
      frame.setAttribute('data-phase', 'reveal');          // 1. UBA + subtext line-reveal

      after(750 + 200, () => {
        frame.setAttribute('data-phase', 'align');          // 2. UBA slides left, flush with subtext

        after(550 + 200, () => {
          frame.setAttribute('data-phase', 'draw');          // 3. graphic mark draws in

          after(950 + 150, () => {
            frame.setAttribute('data-phase', 'fill');        // 4. graphic mark fills

            after(380 + 650, () => {
              frame.setAttribute('data-phase', 'exit');      // 5. collapse to the centre line

              after(620 + 750, () => {
                if (onDone) onDone();
              });
            });
          });
        });
      });
    });
  }

  function loop() {
    playOnce(loop);
  }

  function replay() {
    clearLoop();
    loop();
  }

  replayBtn.addEventListener('click', replay);

  loop();
</script>
