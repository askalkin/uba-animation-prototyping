<!doctype html>
<html lang="en" data-prototype-theme="dark" data-animation-mode="only">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green check star sprinkle</title>
    <link rel="stylesheet" href="../../../reference/shared/styles.css">
    <style>
      :root { color-scheme: dark; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #080907;
      }

      .export-preview-shell {
        width: min(720px, 100vw);
        min-height: min(720px, 100vh);
        display: grid;
        place-items: center;
        overflow: visible;
      }

      .export-preview-shell .stage-band {
        width: min(620px, 96vw);
        min-height: min(620px, 96vh);
        overflow: visible;
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] {
        min-height: min(760px, 100vh);
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] .stage-band {
        min-height: min(700px, 96vh);
      }

      /* Code-entry mockups size themselves from the viewport (calc(100vw - 96px)).
         Inside a narrow preview frame that squeezes six 56px-tall cells into a
         fraction of their width, so they render as tall pills instead of cells.
         Pin them to the design width and scale the whole scene down instead. */
      .export-preview-shell .animation-only-otp.alty-mockup-prototype,
      .export-preview-shell .animation-only-securepass.alty-mockup-prototype,
      .export-preview-shell .animation-only-otp-slot {
        width: 361px;
        max-width: none;
      }

      @media (max-width: 460px) {
        .export-preview-shell .animation-only-otp.alty-mockup-prototype,
        .export-preview-shell .animation-only-securepass.alty-mockup-prototype {
          transform: scale(0.62);
          transform-origin: 50% 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell export-preview-shell" data-prototype-theme="dark" data-animation-mode="only" data-preview-motion-source="green-success-stars">
      <section class="stage-band" data-animation-only-page="core-spinners-02">
        <div class="animation-only-motion-slot animation-only-motion-core-spinner-02" data-motion-source="green-success-stars" aria-hidden="true">
              <div class="prototype-motion-render">
            <div class="loader-scene success-wheel-two-scene success-wheel-two-green-scene green-success-stars-scene" role="img" aria-label="Green circular loader filling and resolving into a check with a sprinkle of four-pointed stars">
              <div class="success-star-field" aria-hidden="true">
        
                <span
                  class="success-star"
                  style="--star-x:32px; --star-y:-30px; --star-size:13px; --star-rotate:10deg; --star-color:var(--success-star-white); --star-delay:0ms;"
                ></span>
      
                <span
                  class="success-star"
                  style="--star-x:-34px; --star-y:6px; --star-size:9px; --star-rotate:-16deg; --star-color:var(--success-star-green); --star-delay:130ms;"
                ></span>
      
                <span
                  class="success-star"
                  style="--star-x:14px; --star-y:34px; --star-size:10px; --star-rotate:20deg; --star-color:var(--success-star-white); --star-delay:260ms;"
                ></span>
      
              </div>
      
            <div class="success-wheel-two-mark">
              <svg class="success-wheel-two-svg" viewBox="0 0 120 120" aria-hidden="true">
                <g class="success-wheel-two-rotor">
                  <circle class="success-wheel-two-line" cx="60" cy="60" r="34" pathLength="100"></circle>
                </g>
                <circle class="success-wheel-two-fill" cx="60" cy="60" r="34"></circle>
                <path class="success-wheel-two-check " d="M42 61 L55 73 L79 45" pathLength="78"></path>
              </svg>
            </div>
  
            </div>
          </div>
            </div>
      </section>
    </div>
    <script src="../../../reference/shared/assets/lottie-svg.min.js"></script>
    <script src="../../../reference/shared/assets/confetti-lottie-data.js"></script>
    <script src="../../../reference/shared/assets/uba-spinner-data.js"></script>
    <script src="../../../reference/shared/preview-runtime.js"></script>
  </body>
</html>
