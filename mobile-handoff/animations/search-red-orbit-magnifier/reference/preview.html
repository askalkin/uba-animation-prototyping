<!doctype html>
<html lang="en" data-prototype-theme="dark" data-animation-mode="only">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit magnifier</title>
    <link rel="stylesheet" href="../../../reference/shared/styles.css">
    <style>
      :root { color-scheme: dark; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #080907;
      }

      .export-preview-shell {
        width: min(720px, 100vw);
        min-height: min(720px, 100vh);
        display: grid;
        place-items: center;
        overflow: visible;
      }

      .export-preview-shell .stage-band {
        width: min(620px, 96vw);
        min-height: min(620px, 96vh);
        overflow: visible;
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] {
        min-height: min(760px, 100vh);
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] .stage-band {
        min-height: min(700px, 96vh);
      }

      /* Code-entry mockups size themselves from the viewport (calc(100vw - 96px)).
         Inside a narrow preview frame that squeezes six 56px-tall cells into a
         fraction of their width, so they render as tall pills instead of cells.
         Pin them to the design width and scale the whole scene down instead. */
      .export-preview-shell .animation-only-otp.alty-mockup-prototype,
      .export-preview-shell .animation-only-securepass.alty-mockup-prototype,
      .export-preview-shell .animation-only-otp-slot {
        width: 361px;
        max-width: none;
      }

      @media (max-width: 460px) {
        .export-preview-shell .animation-only-otp.alty-mockup-prototype,
        .export-preview-shell .animation-only-securepass.alty-mockup-prototype {
          transform: scale(0.62);
          transform-origin: 50% 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell export-preview-shell" data-prototype-theme="dark" data-animation-mode="only" data-preview-motion-source="search-red-orbit-magnifier">
      <section class="stage-band" data-animation-only-page="searching-keyboard">
        <div class="animation-only-motion-slot animation-only-motion-searching" data-motion-source="search-red-orbit-magnifier" aria-hidden="true">
              <div class="prototype-motion-render">
              <div class="loader-scene search-red-magnifier-scene search-red-orbit-magnifier-scene" role="img" aria-label="Compact red magnifier inside orbit scanner">
        
            <svg class="orbit-scanner-svg" viewBox="0 0 120 120" aria-hidden="true">
              <defs>
                <linearGradient id="orbit-line-gradient" class="orbit-line-gradient" x1="0" y1="0" x2="1" y2="1">
                  <stop class="orbit-stop-bright" offset="0%"></stop>
                  <stop class="orbit-stop-fade" offset="100%"></stop>
                </linearGradient>
              </defs>
      
              <g class="orbit-ring orbit-ring-inner">
                <path d="M 86.00 60.00 A 26 26 0 0 1 34.89 66.73"></path>
              </g>
              <g class="orbit-ring orbit-ring-mid">
                <path d="M 94.00 60.00 A 34 34 0 0 1 30.56 77.00"></path>
              </g>
              <g class="orbit-ring orbit-ring-outer">
                <path d="M 102.00 60.00 A 42 42 0 1 1 18.16 56.34"></path>
              </g>
            </svg>
  
        
            <span class="search-spinner-illustration search-red-magnifier-illustration" aria-hidden="true">
              <img src="../../../reference/shared/assets/search-magnifier-red.webp" alt="">
            </span>
  
              </div>
            </div>
            </div>
      </section>
    </div>
    <script src="../../../reference/shared/assets/lottie-svg.min.js"></script>
    <script src="../../../reference/shared/assets/confetti-lottie-data.js"></script>
    <script src="../../../reference/shared/assets/uba-spinner-data.js"></script>
    <script src="../../../reference/shared/preview-runtime.js"></script>
  </body>
</html>
