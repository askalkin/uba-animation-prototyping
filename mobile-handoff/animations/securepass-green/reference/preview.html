<!doctype html>
<html lang="en" data-prototype-theme="dark" data-animation-mode="only">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass green</title>
    <link rel="stylesheet" href="../../../reference/shared/styles.css">
    <style>
      :root { color-scheme: dark; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #080907;
      }

      .export-preview-shell {
        width: min(720px, 100vw);
        min-height: min(720px, 100vh);
        display: grid;
        place-items: center;
        overflow: visible;
      }

      .export-preview-shell .stage-band {
        width: min(620px, 96vw);
        min-height: min(620px, 96vh);
        overflow: visible;
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] {
        min-height: min(760px, 100vh);
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] .stage-band {
        min-height: min(700px, 96vh);
      }

      /* Code-entry mockups size themselves from the viewport (calc(100vw - 96px)).
         Inside a narrow preview frame that squeezes six 56px-tall cells into a
         fraction of their width, so they render as tall pills instead of cells.
         Pin them to the design width and scale the whole scene down instead. */
      .export-preview-shell .animation-only-otp.alty-mockup-prototype,
      .export-preview-shell .animation-only-securepass.alty-mockup-prototype,
      .export-preview-shell .animation-only-otp-slot {
        width: 361px;
        max-width: none;
      }

      @media (max-width: 460px) {
        .export-preview-shell .animation-only-otp.alty-mockup-prototype,
        .export-preview-shell .animation-only-securepass.alty-mockup-prototype {
          transform: scale(0.62);
          transform-origin: 50% 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell export-preview-shell" data-prototype-theme="dark" data-animation-mode="only" data-preview-motion-source="securepass-green">
      <section class="stage-band" data-animation-only-page="verify-securepass">
        <div class="animation-only-scene animation-only-prototype alty-mockup-prototype animation-only-otp animation-only-securepass" role="group" aria-label="SecurePass green animation only preview">
                <div class="animation-only-otp-slot is-green" aria-hidden="true">
          
            <div class="alty-mock-otp-cells  is-green" aria-hidden="true">
      
                    <span style="--otp-index:0; --otp-shift:154px;">
                      <b>1</b>
                    </span>
          
                    <span style="--otp-index:1; --otp-shift:92px;">
                      <b>2</b>
                    </span>
          
                    <span style="--otp-index:2; --otp-shift:31px;">
                      <b>3</b>
                    </span>
          
                    <span style="--otp-index:3; --otp-shift:-31px;">
                      <b>5</b>
                    </span>
          
                    <span style="--otp-index:4; --otp-shift:-92px;">
                      <b>3</b>
                    </span>
          
                    <span style="--otp-index:5; --otp-shift:-154px;">
                      <b>3</b>
                    </span>
          
      
                <svg class="alty-mock-otp-success" viewBox="0 0 64 64" aria-hidden="true">
                  <circle cx="32" cy="32" r="25"></circle>
                  <path d="M20 33.5 29 42 45 23"></path>
                </svg>
      
            </div>
  
                </div>
              </div>
      </section>
    </div>
    <script src="../../../reference/shared/assets/lottie-svg.min.js"></script>
    <script src="../../../reference/shared/assets/confetti-lottie-data.js"></script>
    <script src="../../../reference/shared/assets/uba-spinner-data.js"></script>
    <script src="../../../reference/shared/preview-runtime.js"></script>
  </body>
</html>
