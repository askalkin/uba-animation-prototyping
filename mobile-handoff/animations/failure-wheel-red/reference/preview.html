<!doctype html>
<html lang="en" data-prototype-theme="dark" data-animation-mode="only">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red fill to X</title>
    <link rel="stylesheet" href="../../../reference/shared/styles.css">
    <style>
      :root { color-scheme: dark; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #080907;
      }

      .export-preview-shell {
        width: min(720px, 100vw);
        min-height: min(720px, 100vh);
        display: grid;
        place-items: center;
        overflow: visible;
      }

      .export-preview-shell .stage-band {
        width: min(620px, 96vw);
        min-height: min(620px, 96vh);
        overflow: visible;
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] {
        min-height: min(760px, 100vh);
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] .stage-band {
        min-height: min(700px, 96vh);
      }

      /* Code-entry mockups size themselves from the viewport (calc(100vw - 96px)).
         Inside a narrow preview frame that squeezes six 56px-tall cells into a
         fraction of their width, so they render as tall pills instead of cells.
         Pin them to the design width and scale the whole scene down instead. */
      .export-preview-shell .animation-only-otp.alty-mockup-prototype,
      .export-preview-shell .animation-only-securepass.alty-mockup-prototype,
      .export-preview-shell .animation-only-otp-slot {
        width: 361px;
        max-width: none;
      }

      @media (max-width: 460px) {
        .export-preview-shell .animation-only-otp.alty-mockup-prototype,
        .export-preview-shell .animation-only-securepass.alty-mockup-prototype {
          transform: scale(0.62);
          transform-origin: 50% 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell export-preview-shell" data-prototype-theme="dark" data-animation-mode="only" data-preview-motion-source="failure-wheel-red">
      <section class="stage-band" data-animation-only-page="couldnt-load-results">
        <div class="animation-only-motion-slot animation-only-motion-failed" data-motion-source="failure-wheel-red" aria-hidden="true">
              <div class="prototype-motion-render">
            <div class="loader-scene success-wheel-two-scene   success-wheel-two-error-scene" role="img" aria-label="Circular loader filling red and resolving into an X">
      
            <div class="success-wheel-two-mark">
              <svg class="success-wheel-two-svg" viewBox="0 0 120 120" aria-hidden="true">
                <g class="success-wheel-two-rotor">
                  <circle class="success-wheel-two-line" cx="60" cy="60" r="34" pathLength="100"></circle>
                </g>
                <circle class="success-wheel-two-fill" cx="60" cy="60" r="34"></circle>
                <path class="success-wheel-two-check is-error" d="M43 43 L77 77 M77 43 L43 77" pathLength="78"></path>
              </svg>
            </div>
  
            </div>
          </div>
            </div>
      </section>
    </div>
    <script src="../../../reference/shared/assets/lottie-svg.min.js"></script>
    <script src="../../../reference/shared/assets/confetti-lottie-data.js"></script>
    <script src="../../../reference/shared/assets/uba-spinner-data.js"></script>
    <script src="../../../reference/shared/preview-runtime.js"></script>
  </body>
</html>
