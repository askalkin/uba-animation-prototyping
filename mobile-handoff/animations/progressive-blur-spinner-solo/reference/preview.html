<!doctype html>
<html lang="en" data-prototype-theme="dark" data-animation-mode="only">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red comet arc</title>
    <link rel="stylesheet" href="../../../reference/shared/styles.css">
    <style>
      :root { color-scheme: dark; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #080907;
      }

      .export-preview-shell {
        width: min(720px, 100vw);
        min-height: min(720px, 100vh);
        display: grid;
        place-items: center;
        overflow: visible;
      }

      .export-preview-shell .stage-band {
        width: min(620px, 96vw);
        min-height: min(620px, 96vh);
        overflow: visible;
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] {
        min-height: min(760px, 100vh);
      }

      .export-preview-shell[data-preview-motion-source="identity-bust-focus"] .stage-band {
        min-height: min(700px, 96vh);
      }

      /* Code-entry mockups size themselves from the viewport (calc(100vw - 96px)).
         Inside a narrow preview frame that squeezes six 56px-tall cells into a
         fraction of their width, so they render as tall pills instead of cells.
         Pin them to the design width and scale the whole scene down instead. */
      .export-preview-shell .animation-only-otp.alty-mockup-prototype,
      .export-preview-shell .animation-only-securepass.alty-mockup-prototype,
      .export-preview-shell .animation-only-otp-slot {
        width: 361px;
        max-width: none;
      }

      @media (max-width: 460px) {
        .export-preview-shell .animation-only-otp.alty-mockup-prototype,
        .export-preview-shell .animation-only-securepass.alty-mockup-prototype {
          transform: scale(0.62);
          transform-origin: 50% 50%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell export-preview-shell" data-prototype-theme="dark" data-animation-mode="only" data-preview-motion-source="progressive-blur-spinner-solo">
      <section class="stage-band" data-animation-only-page="account-opening-almost-there">
        <div class="animation-only-motion-slot animation-only-motion-almost" data-motion-source="progressive-blur-spinner-solo" aria-hidden="true">
              <div class="prototype-motion-render">
              <div class="loader-scene progressive-solo-scene" role="img" aria-label="Compact red comet arc">
        
            <svg class="comet-svg" viewBox="0 0 120 120" aria-hidden="true">
              <defs>
                <linearGradient id="prototype-core-comet-trail" x1="88" y1="18" x2="23" y2="93" gradientUnits="userSpaceOnUse">
          
                  <stop offset="0%" stop-color="rgba(255, 36, 56, 1)"></stop>
                  <stop offset="48%" stop-color="rgba(255, 36, 56, 0.55)"></stop>
                  <stop offset="100%" stop-color="rgba(255, 36, 56, 0)"></stop>
        
                </linearGradient>
                <filter id="prototype-core-comet-glow" x="-35%" y="-35%" width="170%" height="170%">
                  <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
                  <feColorMatrix
                    in="blur"
                    type="matrix"
                    values="1 0 0 0 0.9  0 0.22 0 0 0.02  0 0 0.18 0 0.03  0 0 0 1 0"
                  ></feColorMatrix>
                </filter>
              </defs>
              <g class="svg-spin">
                <circle
                  class="comet-glow comet-trim"
                  cx="60"
                  cy="60"
                  r="34"
                  pathLength="100"
                  stroke="url(#prototype-core-comet-trail)"
                  filter="url(#prototype-core-comet-glow)"
                ></circle>
                <circle
                  class="comet-stroke comet-trim"
                  cx="60"
                  cy="60"
                  r="34"
                  pathLength="100"
                  stroke="url(#prototype-core-comet-trail)"
                ></circle>
              </g>
            </svg>
  
              </div>
            </div>
            </div>
      </section>
    </div>
    <script src="../../../reference/shared/assets/lottie-svg.min.js"></script>
    <script src="../../../reference/shared/assets/confetti-lottie-data.js"></script>
    <script src="../../../reference/shared/assets/uba-spinner-data.js"></script>
    <script src="../../../reference/shared/preview-runtime.js"></script>
  </body>
</html>
